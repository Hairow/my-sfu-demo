<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- This adapter normalizes cross-browser differences in WebRTC APIs. Currently necessary in order to support Firefox. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/webrtc-adapter/8.1.2/adapter.min.js"
        integrity="sha512-l40eBFtXx+ve5RryIELC3y6/OM6Nu89mLGQd7fg1C93tN6XrkC3supb+/YiD/Y+B8P37kdJjtG1MT1kOO2VzxA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>

<body>
    <div class="grid">
        <h1>Realtime Video Conference <span id="room-label"></span></h1>
        <div class="controls">
            <button id="video-toggle" data-on="视频：开" data-off="视频：关">视频：开</button>
            <button id="audio-toggle" data-on="音频：开" data-off="音频：关">音频：开</button>
        </div>
        <div id="videos">
            <div class="video-card">
                <h2>我</h2>
                <div class="video-wrap">
                    <video id="local-video" autoplay muted playsinline></video>
                    <div id="video-off-hint" class="video-hint" hidden>摄像头已关闭</div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./app.js"></script>
    <style>
        html {
            color-scheme: light dark;
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                'Segoe UI',
                Roboto,
                Oxygen,
                Ubuntu,
                Cantarell,
                'Open Sans',
                'Helvetica Neue',
                sans-serif;
            background: white;
            color: black;
        }

        body,
        h1,
        h2 {
            margin: 0;
        }

        h1,
        h2 {
            font-weight: 400;
        }

        h1 {
            font-size: 1.5rem;
        }

        h1 #room-label {
            font-size: 1rem;
            color: #777;
            margin-left: 0.5rem;
        }

        h2 {
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            color: #555;
        }

        video {
            /* 固定宽高比，布局稳定；黑屏/未出流时不塌陷 */
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            background: #000;
        }

        video.muted {
            filter: grayscale(1) brightness(0.6);
        }

        .grid {
            display: grid;
            gap: clamp(0.75rem, 2vw, 1rem);
            max-width: 1280px;
            margin: 0 auto;
            padding: clamp(0.75rem, 2vw, 1.5rem);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .controls button {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            border: 1px solid #999;
            border-radius: 6px;
            background: #fafafa;
            color: #000;
            cursor: pointer;
        }

        .controls button.off {
            background: #d33;
            border-color: #d33;
            color: #fff;
        }

        #videos {
            /* min(100%, 280px) 防止小屏横向溢出（280px 大于 320px 屏） */
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
            gap: clamp(0.75rem, 2vw, 1rem);
        }

        .video-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 0.5rem;
            background: #fafafa;
            overflow: hidden;
        }

        .video-wrap {
            position: relative;
        }

        .video-hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            background: rgba(0, 0, 0, 0.1);
        }

        /* 必须显式处理 hidden，否则上面的 display: flex 会覆盖 hidden 属性的默认 display:none */
        .video-hint[hidden] {
            display: none;
        }

        /* ---- 移动端适配 ---- */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.15rem;
            }

            /* 按钮各占一半，方便触屏 */
            .controls button {
                flex: 1;
                min-width: 0;
                padding: 0.75rem 0.5rem;
                font-size: 1rem;
            }

            .video-card {
                padding: 0.25rem;
            }

            .video-card h2 {
                font-size: 0.8rem;
                margin-bottom: 0.25rem;
            }
        }

        /* ---- 深色模式 ---- */
        @media (prefers-color-scheme: dark) {
            html {
                background: #111;
                color: #eee;
            }

            h2 {
                color: #aaa;
            }

            h1 #room-label {
                color: #888;
            }

            .controls button {
                background: #2a2a2a;
                border-color: #555;
                color: #eee;
            }

            .controls button.off {
                background: #b00;
                border-color: #b00;
            }

            .video-card {
                background: #1c1c1c;
                border-color: #333;
            }
        }
    </style>
</body>

</html>
